name: Verifica modifiche Multimon

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4
      - name: Configura Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installa dipendenze
        run: npm install --no-audit --no-fund
      - name: Test automatici
        run: npm test
      - name: Build Vite
        run: npm run build
